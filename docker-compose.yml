services:
  tests:
    build: .
    environment:
      SAFE_MIGRATIONS_MYSQL_HOST: mysql
      SAFE_MIGRATIONS_PGSQL_HOST: pgsql
      SAFE_MIGRATIONS_MARIADB_HOST: mariadb
      SAFE_MIGRATIONS_DB_NAME: safe_migrations
      SAFE_MIGRATIONS_DB_USER: safe
      SAFE_MIGRATIONS_DB_PASSWORD: secret
    depends_on:
      mysql:
        condition: service_healthy
      pgsql:
        condition: service_healthy
      mariadb:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: safe_migrations
      MYSQL_USER: safe
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usafe", "-psecret"]
      interval: 3s
      timeout: 3s
      retries: 30

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: safe_migrations
      MARIADB_USER: safe
      MARIADB_PASSWORD: secret
      MARIADB_ROOT_PASSWORD: secret
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30

  pgsql:
    image: postgres:17
    environment:
      POSTGRES_DB: safe_migrations
      POSTGRES_USER: safe
      POSTGRES_PASSWORD: secret
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "safe", "-d", "safe_migrations"]
      interval: 3s
      timeout: 3s
      retries: 30
