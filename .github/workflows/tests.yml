name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
        laravel: ["11.*", "12.*", "13.*"]
        include:
          - laravel: "11.*"
            testbench: "9.*"
          - laravel: "12.*"
            testbench: "10.*"
          - laravel: "13.*"
            testbench: "11.*"
        exclude:
          - php: "8.2"
            laravel: "13.*"

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: safe_migrations
          MYSQL_USER: safe
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: secret
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -usafe -psecret"
          --health-interval 5s --health-timeout 5s --health-retries 20
      pgsql:
        image: postgres:17
        env:
          POSTGRES_DB: safe_migrations
          POSTGRES_USER: safe
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U safe -d safe_migrations"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      SAFE_MIGRATIONS_MYSQL_HOST: 127.0.0.1
      SAFE_MIGRATIONS_PGSQL_HOST: 127.0.0.1
      SAFE_MIGRATIONS_DB_NAME: safe_migrations
      SAFE_MIGRATIONS_DB_USER: safe
      SAFE_MIGRATIONS_DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/console:${{ matrix.laravel }}" "illuminate/database:${{ matrix.laravel }}" "illuminate/support:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Run tests
        run: vendor/bin/phpunit
